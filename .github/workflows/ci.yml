# Testa o núcleo (vault_core, CLI e MCP) no Linux e no Windows a cada envio.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  nucleo:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo test
