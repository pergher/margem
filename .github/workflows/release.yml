# Gera o instalador do Windows e publica a versão no GitHub (Releases) quando se envia uma tag vX.Y.Z.
# O app instalado procura o arquivo latest.json desta release para se atualizar.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"
      - run: npm ci
        working-directory: app
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "Margem ${{ github.ref_name }}"
          releaseBody: "Instalador para Windows. Quem já tem o app instalado recebe esta versão pelo próprio app (Configurações › Atualizações)."
          releaseDraft: false
          prerelease: false

  # APK do Android (instalado e atualizado pelo Obtainium a partir desta release). Roda depois do job do Windows,
  # que cria a release. A assinatura usa o keystore guardado nos secrets (ver docs/publicar.md, "Android").
  android:
    needs: windows
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # O runner do GitHub já traz o Android SDK ($ANDROID_HOME) e o sdkmanager; só faltam os pacotes certos.
      - name: Instalar plataforma, build-tools e NDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"
      - run: npm ci
        working-directory: app
      - name: Gerar o projeto Android (a pasta gen/ não é versionada)
        run: npx tauri android init --ci
        working-directory: app
      - run: scripts/android-manifesto.sh
      - name: Compilar o APK (aarch64)
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          npx tauri android build --apk --target aarch64
        working-directory: app
      - name: Assinar e publicar na release
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find src-tauri/gen/android -name "app-universal-release-unsigned.apk" | head -1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/margem.jks"
          SAIDA="Margem-${GITHUB_REF_NAME}-android.apk"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/alinhado.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign --ks "$RUNNER_TEMP/margem.jks" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --out "$SAIDA" "$RUNNER_TEMP/alinhado.apk"
          gh release upload "$GITHUB_REF_NAME" "$SAIDA" --clobber
