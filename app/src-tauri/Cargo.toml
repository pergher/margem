[package]
name = "margem-app"
version = "0.1.17"
edition = "2021"

[lib]
name = "margem_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vault_core = { path = "../.." }
dunce = "1"
tauri-plugin-dialog = "2"
# IA (Etapa M): rede só pelo Rust. rustls evita OpenSSL no Windows.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
async-trait = "0.1"
tokio = { version = "1", features = ["time"] }
# Observador de arquivos (todas as plataformas).
notify = "8"
notify-debouncer-full = "0.6"

# Só no computador: atualizador e reinício (no Android, Obtainium).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Chave de API no cofre do sistema (Credential Manager no Windows).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true

[workspace]
